<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow"><title>구궁판 시험 설치</title>
<style>
:root{--bg:#f6f4ef;--fg:#222;--sub:#666;--btn:#1f3a5f}
@media(prefers-color-scheme:dark){:root{--bg:#16181c;--fg:#eee;--sub:#aaa;--btn:#3d6aa8}}
body{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;margin:0;padding:24px 16px;background:var(--bg);color:var(--fg);line-height:1.6}
main{max-width:480px;margin:0 auto}h1{font-size:22px;margin:0 0 4px}p.v{color:var(--sub);margin:0 0 20px}
a.b{display:block;text-align:center;background:var(--btn);color:#fff;text-decoration:none;font-size:18px;font-weight:600;padding:16px;border-radius:12px}
ol{padding-left:20px}li{margin:6px 0}small{color:var(--sub)}
</style></head><body><main>
<h1>구궁판 시험 설치</h1>
<p class="v">구궁판 1.0 (141)</p>
<a class="b" href="itms-services://?action=download-manifest&amp;url=https://godssangmul-creator.github.io/gugungpan-web/t/4535e5e891de619bb58f/manifest.plist">아이폰에 설치</a>
<ol>
<li>아이폰 사파리에서 이 화면을 열고 위 단추를 누른 뒤 "설치"를 누릅니다.</li>
<li>홈 화면에 구궁판이 생깁니다. 내려받는 데 1분쯤 걸립니다.</li>
<li>앱이 안 열리고 "개발자 모드 필요"가 뜨면: 설정 → 개인정보 보호 및 보안 → 개발자 모드를 켜고, 다시 시작한 뒤 "켜기"를 누릅니다.</li>
</ol>
<small>등록한 아이폰에만 설치됩니다. 이 주소는 밖에 알리지 마세요.</small>
</main></body></html>
